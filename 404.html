<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting... | Virorah</title>

  <!-- Canonical points to pms subdomain so Google consolidates authority there -->
  <link rel="canonical" href="https://pms.virorah.com">

  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{background:#050410;color:#f4f3ff;font-family:'DM Sans',sans-serif;
         display:flex;align-items:center;justify-content:center;
         min-height:100vh;text-align:center;padding:24px;}
    .wrap{max-width:480px;}
    .logo{font-size:22px;font-weight:700;letter-spacing:.5px;margin-bottom:32px;
          background:linear-gradient(135deg,#667eea,#764ba2);
          -webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    p{font-size:15px;color:rgba(165,180,252,.6);line-height:1.7;margin-bottom:20px;}
    a{color:#a5b4fc;text-decoration:none;}
    a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">Virorah PMS</div>
    <p>Taking you to the right place&hellip;</p>
    <p><a id="redirect-link" href="https://pms.virorah.com">Click here if you are not redirected automatically.</a></p>
  </div>

  <script>
    (function(){
      // Build the destination: pms.virorah.com + same path + same query string
      var path  = window.location.pathname;  // e.g. /home
      var query = window.location.search;    // e.g. ?slug=calibration

      // scenarios-details with Airtable recordId params: send to /scenarios
      if(path.indexOf('/scenarios-details') === 0){
        window.location.replace('https://pms.virorah.com/scenarios');
        return;
      }

      // Everything else: mirror the path on pms.virorah.com
      var dest = 'https://pms.virorah.com' + path + query;
      document.getElementById('redirect-link').href = dest;
      window.location.replace(dest);
    })();
  </script>
</body>
</html>
